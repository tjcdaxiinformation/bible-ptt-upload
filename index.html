<div class="upload-card">
    <p class="slogan">讓聖靈的感動，依日期珍藏於教會雲端...</p>
    
    <input type="file" id="fileInput" multiple accept="image/*,video/*" style="display:none">
    <button id="uploadBtn" class="upload-btn">一鍵上傳至 Google Drive</button>
    
    <div id="status" style="margin-top:20px; color:#1a73e8; font-weight:bold;"></div>
    <div id="preview-grid"></div>
</div>

<script>
    const scriptUrl = 'https://script.google.com/macros/s/AKfycbyop5rb3uT6OhmdxyBoRAHxbuoYHva_ASQ6KqAPPWiBt_AD8jamNHPV5mPpZdW2uDov/exec'; // 貼上第一步取得的網址
    const uploadBtn = document.getElementById('uploadBtn');
    const fileInput = document.getElementById('fileInput');
    const status = document.getElementById('status');

    uploadBtn.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', async () => {
        const files = fileInput.files;
        if (files.length === 0) return;

        status.innerText = "正在處理並依日期分類中...";
        
        for (let file of files) {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async () => {
                const base64 = reader.result.split(',')[1];
                const payload = {
                    base64: base64,
                    type: file.type,
                    name: file.name
                };

                try {
                    const response = await fetch(scriptUrl, {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });
                    const result = await response.json();
                    if(result.result === 'success') {
                        status.innerText = "✅ 上傳成功！已存入今日資料夾。";
                        showPreview(reader.result);
                    }
                } catch (e) {
                    status.innerText = "❌ 上傳失敗，請稍後再試。";
                }
            };
        }
    });

    function showPreview(src) {
        const grid = document.getElementById('preview-grid');
        const img = document.createElement('img');
        img.src = src;
        img.className = 'thumb';
        grid.appendChild(img);
    }
</script>
